name: Deploy Nutri Solutions to EC2

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GITHUB_TOKEN
          script: |
            echo "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com" | sudo tee /root/.git-credentials > /dev/null
            sudo git config --global credential.helper store
            sudo GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" NODE_OPTIONS="--max-old-space-size=2048" /root/nutri_solutions/scripts/deploy.sh
