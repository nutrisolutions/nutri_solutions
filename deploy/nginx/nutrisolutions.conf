# nginx config for the public website (www.nutrisolutions.co.in).
# The API host (api.nutrisolutions.co.in) is NOT covered here — leave its server block as is.
#
# Install (on the EC2 box, as root):
#   cp deploy/nginx/security-headers.conf /etc/nginx/snippets/nutrisolutions-security-headers.conf
#   cp deploy/nginx/nutrisolutions.conf   /etc/nginx/sites-available/nutrisolutions.conf
#   # check the ssl_certificate paths below match `ls /etc/letsencrypt/live/`
#   ln -sf /etc/nginx/sites-available/nutrisolutions.conf /etc/nginx/sites-enabled/nutrisolutions.conf
#   # remove/disable the OLD server blocks for nutrisolutions.co.in / www (keep the api one!)
#   nginx -t && systemctl reload nginx
#
# Layout produced by `npm run build:seo` (client/scripts/prerender.mjs):
#   /var/www/nutrisolutions/index.html          plain SPA shell (admin + fallback)
#   /var/www/nutrisolutions/_pages/<route>.html prerendered public pages
#   /var/www/nutrisolutions/_pages/404.html     prerendered not-found page

# ---------- HTTP -> HTTPS www (both hosts) ----------
server {
    listen 80;
    listen [::]:80;
    server_name nutrisolutions.co.in www.nutrisolutions.co.in;
    return 301 https://www.nutrisolutions.co.in$request_uri;
}

# ---------- HTTPS bare domain -> www ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nutrisolutions.co.in;

    ssl_certificate     /etc/letsencrypt/live/nutrisolutions.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nutrisolutions.co.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.nutrisolutions.co.in$request_uri;
}

# ---------- canonical site ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.nutrisolutions.co.in;

    ssl_certificate     /etc/letsencrypt/live/nutrisolutions.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nutrisolutions.co.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/nutrisolutions;
    index index.html;
    server_tokens off;

    # Compression (server-level so it doesn't clash with `gzip on;` in Ubuntu's nginx.conf).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml application/rss+xml image/svg+xml font/woff2;

    include /etc/nginx/snippets/nutrisolutions-security-headers.conf;

    # Real 404 status, prerendered not-found page.
    error_page 404 /_pages/404.html;

    # Prerendered files are only reachable through the clean URLs below.
    location /_pages/ {
        internal;
        include /etc/nginx/snippets/nutrisolutions-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Hashed build assets: cache forever.
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/nutrisolutions-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Old client-side aliases.
    location = /process   { return 301 /about; }
    location = /portfolio { return 301 /projects; }

    # Admin is a client-side app (not prerendered, disallowed in robots.txt).
    location /admin {
        try_files $uri /index.html;
        include /etc/nginx/snippets/nutrisolutions-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = / {
        try_files /_pages/index.html /index.html;
        include /etc/nginx/snippets/nutrisolutions-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        # Strip trailing slashes: /about/ -> /about
        rewrite ^/(.+)/$ /$1 permanent;

        # Static files (robots.txt, sitemap.xml, favicons, og-image) first, then the prerendered page.
        try_files $uri /_pages$uri.html =404;
        include /etc/nginx/snippets/nutrisolutions-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
